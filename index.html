<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>2048</title>

        <meta name="application-name" content="2048">
        <meta name="description" content="A recreation of the 2048 puzzle game in vanilla JavaScript. Slide the tiles, merge equal numbers and try to reach 2048.">
        <meta name="author" content="Fatma AlObeidli">

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <button id="restart-button" class="top-right-button">Restart Game</button>
        <label class="motion-setting">
            <input type="checkbox" id="reduce-motion-toggle">Reduce Motion
        </label>
        <main>
            <div class="header">
                <h1>2048</h1>

                <div class="score-container">
                    <div class="score-box">
                        <span class="score-label">SCORE</span>
                        <span id="score">0</span>
                    </div>

                    <div class="score-box">
                        <span class="score-label">BEST</span>
                        <span id="best-score">0</span>
                    </div>
                </div>
            </div>

            <div class="game-container">
                <!-- Game board: 16 cells, filled by game.js -->
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>

                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>

                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>

                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
                <div class="cell"></div>
            </div>
        </main>
        <script src="game.js"></script>
    </body>
</html>
